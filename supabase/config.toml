# Supabase CLI 설정 파일.
# `supabase init`이 만드는 전체 파일(로컬 개발용 DB, 포트 설정 등)은 지금 쓰지 않아서, 필요한 부분만 둔다.
# 로컬 Supabase(Docker)를 쓰게 되면 그때 `npx supabase init`으로 다시 만든다.

# CLI가 필수로 요구하는 프로젝트 이름. (대시보드의 프로젝트 이름과 같게)
project_id = "note-trip"

[functions.naver-userinfo]
# Supabase 로그인 토큰 검사를 끈다.
# Supabase Auth가 이 함수를 부를 때 Supabase 토큰이 아니라 "네이버" 토큰을 들고 오기 때문이다.
# (자세한 이유는 functions/naver-userinfo/index.ts 맨 위 주석)
verify_jwt = false
